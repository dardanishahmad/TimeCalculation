
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Duration Calculator</title>

<style>
/* Modern CSS + classic CSS */
:root {
  --primary: #6257e8;
  --bg: #f4f6fb;
  --text: #20243a;
  --muted: #72788b;
  --card: #ffffff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Inter, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.calculator {
  width: 100%;
  max-width: 540px;
  background: var(--card);
  border-radius: 24px;
  padding: 32px;
  box-shadow: 0 15px 50px rgba(30, 40, 90, .09);
}

.header {
  text-align: center;
  margin-bottom: 30px;
}

.icon {
  width: 62px;
  height: 62px;
  background: #eeecff;
  color: var(--primary);
  border-radius: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0 auto 16px;
  font-size: 30px;
}

h1 {
  font-size: 27px;
  margin-bottom: 9px;
}

.header p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}

.field {
  margin-bottom: 21px;
}

label {
  display: block;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 9px;
}

input[type="datetime-local"] {
  width: 100%;
  padding: 14px;
  border: 1px solid #dfe2ec;
  border-radius: 12px;
  font-size: 15px;
  color: var(--text);
  background: #fff;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}

input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(98, 87, 232, .12);
}

.options {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  margin: 4px 0 24px;
}

.options label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
  margin: 0;
  cursor: pointer;
}

.options input {
  accent-color: var(--primary);
}

.actions {
  display: flex;
  gap: 12px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 14px 18px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .2s, opacity .2s;
}

button:hover {
  transform: translateY(-2px);
}

.calculate {
  flex: 1;
  color: white;
  background: var(--primary);
}

.reset {
  color: #555b70;
  background: #f0f1f7;
}

.result {
  display: none;
  margin-top: 25px;
  padding: 22px;
  border-radius: 17px;
  background: linear-gradient(135deg, #f0efff, #f7f5ff);
  text-align: center;
  animation: appear .3s ease;
}

.result.show {
  display: block;
}

.result p {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 10px;
}

.duration {
  font-size: clamp(27px, 7vw, 38px);
  color: var(--primary);
  font-weight: 800;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.details {
  margin-top: 12px;
  font-size: 14px;
  color: #555b70;
  line-height: 1.8;
}

.message {
  color: #c0392b;
  font-size: 13px;
  margin-top: 14px;
  display: none;
  line-height: 1.5;
}

footer {
  text-align: center;
  margin-top: 25px;
  font-size: 12px;
  color: #9297a8;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  .calculator { padding: 23px 19px; }
  h1 { font-size: 23px; }
  .actions { flex-direction: column; }
  .reset { width: 100%; }
}
</style>
</head>

<body>
<main class="calculator">
  <header class="header">
    <div class="icon" aria-hidden="true">◷</div>
    <h1>Time Calculator</h1>
    <p>Calculate the exact time between two dates or times in seconds, minutes, and hours.</p>
  </header>

  <form id="timeForm">
    <div class="field">
      <label for="startTime">Starting date & time</label>
      <input type="datetime-local" id="startTime" required>
    </div>

    <div class="field">
      <label for="endTime">Ending date & time</label>
      <input type="datetime-local" id="endTime" required>
    </div>

    <div class="options">
      <label><input type="checkbox" id="showSeconds" checked> Show seconds</label>
      <label><input type="checkbox" id="showTotal" checked> Show total minutes</label>
    </div>

    <div class="actions">
      <button type="submit" class="calculate">Calculate Duration →</button>
      <button type="reset" class="reset">Reset</button>
    </div>
  </form>

  <p class="message" id="error" role="alert"></p>

  <section class="result" id="result" aria-live="polite">
    <p>Total time duration</p>
    <div class="duration" id="duration">0h 0m 0s</div>
    <div class="details" id="details"></div>
    <button type="button" class="calculate" id="copyBtn"
      style="margin-top:18px; width:100%;">Copy Result</button>
  </section>

  <footer>Accurate calculations · Private · Works offline</footer>
</main>

<script>
const form = document.getElementById("timeForm");
const startInput = document.getElementById("startTime");
const endInput = document.getElementById("endTime");
const result = document.getElementById("result");
const duration = document.getElementById("duration");
const details = document.getElementById("details");
const error = document.getElementById("error");

let copyText = "";

form.addEventListener("submit", function (event) {
  event.preventDefault();
  error.style.display = "none";

  if (!startInput.value || !endInput.value) {
    showError("Please enter both the starting and ending times.");
    return;
  }

  const start = new Date(startInput.value);
  const end = new Date(endInput.value);

  if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) {
    showError("Please enter valid dates and times.");
    return;
  }

  if (end < start) {
    showError("The ending time must be after the starting time. For overnight shifts, select the correct ending date.");
    return;
  }

  const totalSeconds = Math.floor((end - start) / 1000);
  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  const totalHours = totalSeconds / 3600;
  const totalMinutes = totalSeconds / 60;

  const showSeconds = document.getElementById("showSeconds").checked;
  const showTotal = document.getElementById("showTotal").checked;

  const mainParts = [];
  if (days) mainParts.push(days + "d");
  mainParts.push(hours + "h", minutes + "m");
  if (showSeconds) mainParts.push(seconds + "s");

  duration.textContent = mainParts.join(" ");

  const lines = [
    "Days: " + days,
    "Hours: " + hours,
    "Minutes: " + minutes
  ];

  if (showSeconds) lines.push("Seconds: " + seconds);
  if (showTotal) {
    lines.push("Total hours: " + totalHours.toFixed(2));
    lines.push("Total minutes: " + totalMinutes.toFixed(2));
  }

  details.innerHTML = lines.join("<br>");
  copyText = "Time Duration: " + mainParts.join(" ");
  copyText += "\n" + lines.join("\n");

  result.classList.add("show");
});

function showError(message) {
  error.textContent = message;
  error.style.display = "block";
  result.classList.remove("show");
}

form.addEventListener("reset", function () {
  result.classList.remove("show");
  error.style.display = "none";
  copyText = "";
});

document.getElementById("copyBtn").addEventListener("click", async function () {
  try {
    await navigator.clipboard.writeText(copyText);
    this.textContent = "Copied!";
    setTimeout(() => this.textContent = "Copy Result", 1500);
  } catch {
    showError("Clipboard access is unavailable. Please copy the result manually.");
  }
});
</script>
</body>
</html>
